version: '3.8'

services:
  backend:
    build: .
    container_name: alpr_backend
    restart: always
    env_file:
      - .env
    environment:
      - MYSQL_HOST=${MYSQL_HOST}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - APP_ENV=${APP_ENV}
      - DEBUG=${DEBUG}
      - API_PREFIX=${API_PREFIX}
      - HOST=${HOST}
      - PORT=${PORT}
    volumes:
      - ./uploads:/app/uploads
      - ./logs:/app/logs
    depends_on:
      - db
    networks:
      - alpr_network

  db:
    image: mysql:8.0
    container_name: alpr_db
    restart: always
    env_file:
      - .env
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "${MYSQL_PORT}:3306"
    networks:
      - alpr_network

  nginx:
    image: nginx:alpine
    container_name: alpr_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./uploads:/app/uploads:ro
      - ./logs:/app/logs:ro
    depends_on:
      - backend
    networks:
      - alpr_network

networks:
  alpr_network:
    driver: bridge

volumes:
  mysql_data:
