version: '3.8'

services:
  alpr_backend:
    build: .
    container_name: alpr_backend
    restart: always
    environment:
      - ENV=production
      - MYSQL_HOST=alpr_db
      - MYSQL_USER=root
      - MYSQL_PASSWORD=yourpassword # Đổi mật khẩu production
      - MYSQL_DATABASE=alpr_db
    ports:
      - "8000:8000"
    volumes:
      - ./uploads:/app/uploads
      - ./logs:/app/logs
      - ./app/core/best.pt:/app/app/core/best.pt # Đảm bảo model YOLO đã copy vào đây
    depends_on:
      - alpr_db

  alpr_db:
    image: mysql:8.0
    container_name: alpr_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: yourpassword # Đổi mật khẩu production
      MYSQL_DATABASE: alpr_db
      MYSQL_USER: root
      MYSQL_PASSWORD: yourpassword
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

  alpr_nginx:
    image: nginx:latest
    container_name: alpr_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./static:/static
    depends_on:
      - alpr_backend

volumes:
  mysql_data:
    driver: local

# Lưu ý:
# - Đảm bảo file app/core/best.pt (YOLOv8 model) đã có, nếu chưa hãy copy vào đúng vị trí.
# - Đổi tất cả mật khẩu mặc định trước khi deploy production.
# - Nếu cần SSL, chỉnh sửa nginx.conf và mount thêm chứng chỉ vào container nginx.
